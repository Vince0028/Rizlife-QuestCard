name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Dummy values: CI never talks to a real database or mail provider. With no
  # DATABASE_URL / SUPABASE_* set, the apps and tests use a throwaway local JSON DB.
  JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
  NEXT_PUBLIC_STUDENT_PORTAL_URL: http://localhost:3001
  NEXT_PUBLIC_TEACHER_PORTAL_URL: http://localhost:3002
  NEXT_PUBLIC_ADMIN_PORTAL_URL: http://localhost:3003
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, verify, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prisma:validate
      - run: npm run verify
      - run: npm run build

  e2e:
    name: Playwright smoke tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
