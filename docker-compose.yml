services:
  postgres:
    image: postgres:16-alpine
    container_name: rizlife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rizlife_questcard
    ports:
      - "5432:5432"
    volumes:
      - rizlife_pgdata:/var/lib/postgresql/data

volumes:
  rizlife_pgdata:
